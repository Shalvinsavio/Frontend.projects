<head>


<div class="ourproducts" id="product">
  <div>
    <img src="" class="img2" /><br />
    <button class="button" onclick="addToCart('Headphones')">Add</button>
  </div>

  <div>
    <img src="" class="img2" /><br />
    <button class="button" onclick="addToCart('Earbuds')">Add</button>
  </div>
</div>

<h2>Your Cart</h2>
<table border="1" id="cartTable" style="width:50%; text-align:center;">
  <thead>
    <tr>
      <th>Product</th>
      <th>Quantity</th>
    </tr>
  </thead>
  <tbody id="cartBody"></tbody>
</table>
<p id="totalItems"><b>Total Items:</b> 0</p>

    
</head>

<script>
  let cart = {};

  function addToCart(productName) {
    if (cart[productName]) {
      cart[productName]++;
    } else {
      cart[productName] = 1;
    }

    updateCart();
  }

  function updateCart() {
    let cartBody = document.getElementById("cartBody");
    let totalItems = 0;

    cartBody.innerHTML = "";

    for (let product in cart) {
      let row = document.createElement("tr");

      let productCell = document.createElement("td");
      productCell.textContent = product;

      let qtyCell = document.createElement("td");
      qtyCell.textContent = cart[product];

      row.appendChild(productCell);
      row.appendChild(qtyCell);

      cartBody.appendChild(row);

      totalItems += cart[product];
    }

    document.getElementById("totalItems").innerHTML = `<b>Total Items:</b> ${totalItems}`;
  }
</script>
